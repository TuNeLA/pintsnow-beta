# PintsNow BETA: builds TuNeLA/Beer-map branch big-update (public repo, read-only, no secret needed) and deploys it to
# GitHub Pages of THIS repo (https://tunela.github.io/pintsnow-beta/). The live app (Beer-map main /docs) is never touched.
name: beta
on:
  workflow_dispatch: {}
  push: { branches: [main] }   # Claude pushes a "rebuild" commit here after each big-update commit (GitHub cron is unreliable on new repos)
  schedule:
    - cron: "17,47 * * * *"   # every 30 min: picks up new commits on big-update
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: beta-pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: { sha: "${{ steps.app.outputs.sha }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: TuNeLA/Beer-map, ref: big-update, path: app, fetch-depth: 1 }
      - id: app
        run: echo "sha=$(git -C app rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: python3 beta/transform.py app/docs _site "${{ steps.app.outputs.sha }}"
      - name: staging test build (/test/)
        run: |
          if [ -d app/testenv ]; then
            python3 beta/transform.py app/docs _site/test "${{ steps.app.outputs.sha }}" --mode staging --testenv app/testenv
          else
            echo "big-update has no testenv/ yet: no /test/ build"
          fi
      # left T-25: serve the beta bundled (like the live "Pages (bundled)" build): ~135 scripts → 3 files, 51 stylesheets → 1.
      # Off: repo variable BETA_BUNDLE = off. Runs after transform.py (it stamps first; bundle.mjs --stamp re-stamps).
      - uses: actions/setup-node@v4
        if: ${{ vars.BETA_BUNDLE != 'off' }}
        with: { node-version: 22 }
      - name: bundle the beta + the /test/ build (scripts/bundle.mjs, esbuild)
        if: ${{ vars.BETA_BUNDLE != 'off' }}
        run: |
          set -eu
          if ! grep -q -- '--stamp' app/scripts/bundle.mjs 2>/dev/null; then echo "big-update has no bundle.mjs --stamp yet: beta stays unbundled"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/bnd" && cp app/scripts/bundle.mjs "$RUNNER_TEMP/bnd/" && { [ -f app/scripts/stamp.mjs ] && cp app/scripts/stamp.mjs "$RUNNER_TEMP/bnd/" || true; }
          npm install --prefix "$RUNNER_TEMP/bnd" --no-save --no-package-lock --no-audit --no-fund esbuild@0.24.0 acorn@8.12.1
          node "$RUNNER_TEMP/bnd/bundle.mjs" _site --stamp
          if [ -f _site/test/index.html ]; then node "$RUNNER_TEMP/bnd/bundle.mjs" _site/test --stamp; fi
          for f in _site/js/app.bundle*.js _site/test/js/app.bundle*.js; do [ -f "$f" ] && node --check "$f"; done
          grep -c 'app\.bundle' _site/index.html
      - name: the normal beta has no test panel
        run: |
          set -eu
          left="$(find _site -path _site/test -prune -o \( -name testenv.js -o -name 'testbar.*' -o -name test.js \) -print)"
          if [ -n "$left" ] || grep -q 'testbar\|testenv' _site/index.html; then echo "test files in the normal beta: $left"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
